<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PureTec POS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    .splash-container {
      width: 440px;
      height: 320px;
      background: linear-gradient(145deg, #0d1929 0%, #132743 50%, #0d6e8a 100%);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(13, 110, 138, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .splash-container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 50%, rgba(13, 110, 138, 0.15) 0%, transparent 50%);
      animation: glow 4s ease-in-out infinite alternate;
    }

    @keyframes glow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(5%, 5%) scale(1.1); }
    }

    .logo-area {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-icon {
      width: 72px;
      height: 72px;
      background: #141414;
      border: 2px solid #c9a227;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 8px 24px rgba(201, 162, 39, 0.25);
      animation: float 3s ease-in-out infinite;
      overflow: hidden;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 4px;
    }

    .app-name {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .app-subtitle {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 4px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .loading-area {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-top: 10px;
    }

    .loading-bar-track {
      width: 200px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin: 0 auto;
    }

    .loading-bar {
      height: 100%;
      width: 30%;
      background: linear-gradient(90deg, transparent, #14b8a6, transparent);
      border-radius: 2px;
      animation: loading 1.5s ease-in-out infinite;
    }

    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }

    .loading-text {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 12px;
      letter-spacing: 0.5px;
    }

    .version {
      position: absolute;
      bottom: 14px;
      right: 18px;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.2);
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo-area">
      <div class="logo-icon">
        <img class="logo-img" src="logo.png" alt="PureTec POS Logo">
      </div>
      <div class="app-name">PureTec POS</div>
      <div class="app-subtitle">Point of Sale</div>
    </div>
    <div class="loading-area">
      <div class="loading-bar-track">
        <div class="loading-bar"></div>
      </div>
      <div class="loading-text">Starting application...</div>
    </div>
    <div class="version">v1.0.0</div>
  </div>
</body>
</html>
